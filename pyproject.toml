[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bench"
version = "0.1.0"
description = "Deterministic benchmarking framework for coding-agent harnesses"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[project.scripts]
agent-bench = "agent_bench.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
