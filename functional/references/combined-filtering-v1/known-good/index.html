<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskboard</title><link rel="stylesheet" href="styles.css"></head><body><main class="app"><header><h1>Taskboard</h1><p>Keep small pieces of work moving.</p></header><form id="task-form"><label>Task <input id="task-title" required maxlength="100"></label><label>Description <input id="task-description" maxlength="240"></label><label>Status <select id="task-status"><option>Todo</option><option>Doing</option><option>Done</option></select></label><label>Priority <select id="task-priority"><option>Low</option><option selected>Medium</option><option>High</option></select></label><button>Add task</button></form><section aria-label="Task filters"><label>Search <input id="search-filter"></label><label>Status filter <select id="status-filter"><option value="all">All</option><option>Todo</option><option>Doing</option><option>Done</option></select></label><label>Priority filter <select id="priority-filter"><option value="all">All</option><option>Low</option><option>Medium</option><option>High</option></select></label><button id="clear-filters" type="button">Clear filters</button></section><p id="form-error" role="alert"></p><ul id="task-list" aria-live="polite"></ul><p id="empty-state">No matching tasks.</p></main><script type="module" src="app.js"></script></body></html>
