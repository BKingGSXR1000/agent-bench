deviations:
  - Registers one OpenAI-compatible provider pointed at the Agent Bench proxy.
  - Selects the fixed Qwen benchmark model and records its 107520-token context window.
  - Uses Pi's documented qwen-chat-template compatibility mode so each request explicitly enables thinking and preserves non-empty historical thinking.
  - Keeps Pi 0.84.4's default medium thinking level and documented 16384-token custom-model output limit.
  - Retains Pi's normal extension, skill, prompt-template, theme, AGENTS.md, and CLAUDE.md discovery behavior; fresh run-owned state prevents personal configuration from being imported.
  - Disables startup catalog/update networking and install telemetry; model requests to the local proxy remain enabled.
  - Uses native JSON non-interactive mode and preserves a fresh native session for observability.
  - Delivers the prompt as one positional message because Pi 0.84.4 trims piped stdin; positional delivery preserves exact leading and trailing UTF-8 whitespace.
