<!doctype html><html><head><meta charset="utf-8"><title>Taskboard</title></head><body><main><h1>Taskboard</h1><form id="task-form"><label>Task <input id="task-title"></label><label>Description <input id="task-description"></label><label>Status <select id="task-status"><option>Todo</option><option>Doing</option><option>Done</option></select></label><label>Priority <select id="task-priority"><option>Low</option><option>Medium</option><option>High</option></select></label><button>Add task</button></form><label>Search <input id="search-filter"></label><label>Status filter <select id="status-filter"><option value="all">All</option><option>Todo</option><option>Doing</option><option>Done</option></select></label><label>Priority filter <select id="priority-filter"><option value="all">All</option><option>Low</option><option>Medium</option><option>High</option></select></label><button id="clear-filters">Clear filters</button><ul id="task-list"></ul><p id="empty-state">No matching tasks.</p></main><script type="module" src="app.js"></script></body></html>
