<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pocket Ledger</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><h1>Pocket Ledger</h1><p>Keep small everyday spending visible.</p></header><section class="summary" aria-label="Balance summary"><span>Balance</span><strong id="balance">€0.00</strong></section><form id="entry-form"><label>Description <input id="description" required maxlength="60" autocomplete="off"></label><label>Amount <input id="amount" required inputmode="decimal" placeholder="12.50"></label><button>Add entry</button></form><p id="form-error" role="alert"></p><section><div class="section-heading"><h2>Entries</h2><button id="clear-entries" class="quiet" type="button">Clear all</button></div><ul id="entries" aria-live="polite"></ul><p id="empty-state">No entries yet. Add income or an expense to get started.</p></section></main><script src="app.js"></script></body></html>
